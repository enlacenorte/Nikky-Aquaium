<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0a192f" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="aquaAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Badge 1: Brighton & Hove Local Specialist -->
  <g transform="translate(20, 20)">
    <rect width="220" height="200" rx="16" fill="url(#badgeBg)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="1.5" />
    <circle cx="110" cy="65" r="32" fill="rgba(45, 212, 191, 0.1)" stroke="url(#aquaAccent)" stroke-width="2" />
    <!-- Pin / Compass Icon -->
    <path d="M 110 45 C 100 45, 92 53, 92 63 C 92 76, 110 92, 110 92 C 110 92, 128 76, 128 63 C 128 53, 120 45, 110 45 Z" fill="url(#aquaAccent)" />
    <circle cx="110" cy="62" r="4" fill="#0a192f" />
    <text x="110" y="125" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">BRIGHTON &amp; HOVE</text>
    <text x="110" y="145" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="11" font-weight="400" fill="#a7f3d0">Local Independent Expert</text>
    <text x="110" y="175" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="10" letter-spacing="1.5" fill="url(#goldAccent)">★ ★ ★ ★ ★</text>
  </g>

  <!-- Badge 2: Holiday Cover Certified -->
  <g transform="translate(265, 20)">
    <rect width="220" height="200" rx="16" fill="url(#badgeBg)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="1.5" />
    <circle cx="110" cy="65" r="32" fill="rgba(45, 212, 191, 0.1)" stroke="url(#aquaAccent)" stroke-width="2" />
    <!-- Shield / Home Icon -->
    <path d="M 110 42 L 128 50 L 128 72 C 128 84, 110 94, 110 94 C 110 94, 92 84, 92 72 L 92 50 Z" fill="none" stroke="url(#aquaAccent)" stroke-width="2.5" />
    <path d="M 102 66 L 108 72 L 120 58" fill="none" stroke="url(#goldAccent)" stroke-width="2.5" stroke-linecap="round" />
    <text x="110" y="125" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">HOLIDAY COVER</text>
    <text x="110" y="145" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="11" font-weight="400" fill="#a7f3d0">Certified Home Tank Care</text>
    <text x="110" y="175" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600" fill="#38bdf8">Daily Peace of Mind</text>
  </g>

  <!-- Badge 3: 100% Water Chemistry Lab Tested -->
  <g transform="translate(510, 20)">
    <rect width="220" height="200" rx="16" fill="url(#badgeBg)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="1.5" />
    <circle cx="110" cy="65" r="32" fill="rgba(45, 212, 191, 0.1)" stroke="url(#aquaAccent)" stroke-width="2" />
    <!-- Lab Flask Icon -->
    <path d="M 104 46 L 116 46 M 107 46 L 107 58 L 96 78 C 93 84, 97 90, 104 90 L 116 90 C 123 90, 127 84, 124 78 L 113 58 L 113 46" fill="none" stroke="url(#aquaAccent)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="110" cy="78" r="3" fill="url(#goldAccent)" />
    <text x="110" y="125" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">LAB WATER TESTED</text>
    <text x="110" y="145" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="11" font-weight="400" fill="#a7f3d0">Precise Salinity, KH &amp; NO3</text>
    <text x="110" y="175" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600" fill="#2dd4bf">Zero Guesswork</text>
  </g>

  <!-- Badge 4: Authorized Stockist (Fauna Marin / BCUK) -->
  <g transform="translate(755, 20)">
    <rect width="220" height="200" rx="16" fill="url(#badgeBg)" stroke="rgba(45, 212, 191, 0.3)" stroke-width="1.5" />
    <circle cx="110" cy="65" r="32" fill="rgba(45, 212, 191, 0.1)" stroke="url(#aquaAccent)" stroke-width="2" />
    <!-- Marine Star / Coral Emblem -->
    <path d="M 110 42 L 114 56 L 128 58 L 118 68 L 121 82 L 110 74 L 99 82 L 102 68 L 92 58 L 106 56 Z" fill="url(#goldAccent)" />
    <text x="110" y="125" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">AUTHORIZED STOCKIST</text>
    <text x="110" y="145" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="11" font-weight="400" fill="#a7f3d0">Fauna Marin &amp; BCUK</text>
    <text x="110" y="175" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600" fill="#a7f3d0">Elementals Range</text>
  </g>
</svg>
